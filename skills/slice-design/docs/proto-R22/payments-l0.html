<style>
  /* slice tokens (R22) */
  :root {
    --v-500: #D30AD7;
    --v-700: #8B0A8F;
    --white: #FFFFFF;
    --white-90: rgba(255,255,255,0.90);
    --white-70: rgba(255,255,255,0.70);
    --white-22: rgba(255,255,255,0.22);
    --white-14: rgba(255,255,255,0.14);
    --white-12: rgba(255,255,255,0.12);
    --white-10: rgba(255,255,255,0.10);
    --outline-subtle: rgba(255,255,255,0.22);
    --yellow: #FFD400;
    --slate-translucent: rgba(255,255,255,0.18);
    --device-w: 360px;
    --page-pad: 24px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    background: #EFEFF3;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 0;
    color: var(--white);
  }

  .device {
    width: var(--device-w);
    min-height: 780px;
    background: var(--v-500);
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 24px 80px rgba(0,0,0,0.22), 0 6px 16px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
  }

  /* status bar */
  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 500;
    color: var(--white);
  }
  .status-bar .glyphs {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-bar svg { display: block; }

  /* app bar (brand-immersive, no card chrome) */
  .appbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 24px 0;
    height: 64px;
  }

  .check-balance-pill {
    height: 36px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0 14px 0 16px;
    background: transparent;
    border: 1px solid var(--outline-subtle);
    border-radius: 999px;
    color: var(--white);
    font-family: 'Rubik', sans-serif;
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.1px;
  }
  .check-balance-pill .chev {
    margin-left: 2px;
    display: inline-flex;
  }

  .appbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .voice-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--outline-subtle);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF8AD8 0%, #8B0A8F 70%, #4A0750 100%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-weight: 500;
    font-size: 14px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
  }

  /* Action Pills row (R19) */
  .action-pills {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 16px 24px 8px;
    overflow: hidden;
  }
  .action-pill {
    height: 36px;
    border-radius: 999px;
    padding: 10px 16px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--white);
    font-family: 'Rubik', sans-serif;
    font-size: 12px;
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
  }
  .action-pill--upi {
    background: var(--white-12); /* 12% translucent white */
    width: 195px;
    justify-content: flex-start;
  }
  .action-pill--marketing {
    background: var(--white-22); /* 22% — emphasized */
    width: 195px;
    justify-content: flex-start;
  }
  .upi-wordmark {
    font-family: 'Rubik', sans-serif;
    font-style: italic;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    width: 31px;
    height: 16px;
    background: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 100%);
    color: var(--v-500);
    border-radius: 2px;
    justify-content: center;
    padding: 0 2px;
  }
  .bolt-glyph {
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--yellow);
  }

  /* hero stack */
  .hero {
    text-align: center;
    padding: 28px 24px 8px;
  }
  .hero .amount {
    font-family: 'Rubik', sans-serif;
    font-weight: 500;
    font-size: 72px;
    line-height: 1;
    letter-spacing: -2px;
    color: var(--white);
  }
  .hero .amount .rupee {
    /* ₹ matches digit weight — never subscript */
    font-weight: 500;
    font-size: 72px;
    line-height: 1;
  }
  .hero .nudge {
    margin-top: 12px;
    color: var(--white-70);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: -0.1px;
  }

  /* custom keypad */
  .keypad {
    margin-top: 8px;
    padding: 8px 24px 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    row-gap: 4px;
    column-gap: 0;
  }
  .key {
    height: 56px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rubik', sans-serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1;
    color: var(--white);
    background: transparent;
    border: 0;
    user-select: none;
    cursor: pointer;
    /* NO opacity dim — high-frequency taps, no animation */
  }
  .key:active { /* still no scale/bounce — calm fintech */ background: rgba(255,255,255,0.04); }
  .key--icon svg { display: block; }

  /* Request / Transfer Tertiary pills */
  .cta-row {
    display: flex;
    gap: 12px;
    padding: 16px 24px 12px;
  }
  .tertiary-pill {
    flex: 1 1 0;
    height: 48px;
    background: transparent;
    border: 1px solid var(--outline-subtle);
    border-radius: 999px;
    color: var(--white);
    font-family: 'Rubik', sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1;
    padding: 12px 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* floating bottom dock */
  .dock-wrap {
    margin-top: auto;
    padding: 12px 16px 20px;
    position: relative;
  }
  .dock-wrap::before {
    content: "";
    position: absolute;
    top: -24px; left: 0; right: 0; height: 24px;
    background: linear-gradient(180deg, rgba(211,10,215,0) 0%, rgba(211,10,215,0.35) 100%);
    pointer-events: none;
  }
  .dock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
  }
  .dock-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--slate-translucent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    cursor: pointer;
  }
  .dock-icon--qr {
    width: 64px;
    height: 64px;
    background: var(--white);
    color: var(--v-500);
    box-shadow: 0 8px 24px rgba(0,0,0,0.20), 0 2px 6px rgba(0,0,0,0.10);
    transform: translateY(-6px);
  }

  /* home indicator */
  .home-indicator {
    width: 134px;
    height: 5px;
    background: var(--white);
    border-radius: 999px;
    margin: 8px auto 6px;
    opacity: 0.95;
  }

  /* caption under proto for the calibration log reader */
  .caption {
    width: var(--device-w);
    margin: 16px auto 0;
    font-family: 'Rubik', sans-serif;
    font-size: 11px;
    color: #6a6a78;
    text-align: center;
    letter-spacing: -0.1px;
  }
</style>
