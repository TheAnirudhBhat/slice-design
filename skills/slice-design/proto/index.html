<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <!-- theme-color = the surface at the top of the page (App.jsx keeps it in sync;
         this is the first paint's value, the Pay landing pod). iOS picks the status
         glyphs' black or white from it. manifest.webmanifest must NOT declare a
         theme_color: iOS installs the home-screen app from the manifest, and a
         static one pins the bar. -->
    <meta name="theme-color" content="#D30AD7" />
    <!-- PWA / iOS standalone: "Add to Home Screen" launches chrome-less (no Safari
         toolbars) → real OS status bar + home indicator only = true full-bleed.
         The app's mobile/device mode (App.jsx useIsMobile) renders bezel-less to match.
         status-bar-style is "black-translucent": the page draws under the status
         bar, so the bar is transparent, and sheets and scrims cover it.
         The old opaque bar ("default") was a separate strip that iOS repainted from
         theme-color late, and nothing on the page could cover it (user, 2026-10-07).
         iOS 26's blur over a translucent top edge is replaced by a colour fill: see
         components/StatusTint.jsx.
         iOS reads this tag once, when the icon is added. Delete the home-screen icon
         and add it again to pick up a change. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="slice" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>slice app proto</title>
    <!-- Splash (Figma 11762:12087): a static twin of components/Splash.jsx that paints
         before any JS runs. Phone / home-screen app only (the shell's useIsMobile
         query), where the app is full-bleed and the React splash lands exactly on
         top of it; Splash.jsx removes this node once it has mounted. -->
    <link rel="preload" href="/assets/splash_logo.svg" as="image" />
    <style>
      #splash { display: none; }
      @media (max-width: 600px), (display-mode: standalone) {
        #splash { display: flex; position: fixed; inset: 0; z-index: 9999; align-items: center; justify-content: center; background: #D30AD7; }
      }
    </style>
    <!-- Rubik is self-hosted via @fontsource (imported in main.jsx). No Google
         Fonts CDN link — it falls back on slice's corporate network. (R24 cont-31) -->
  </head>
  <body>
    <div id="splash"><img src="/assets/splash_logo.svg" alt="" width="140" height="56" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
